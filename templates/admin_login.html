{% extends "base.html" %}
{% block title %}Admin login · Nagardrishti{% endblock %}
{% block body_class %}page-auth{% endblock %}

{% block content %}
<div class="auth-layout">
    <aside class="auth-panel reveal">
        <p class="eyebrow">Staff only</p>
        <h1>Headquarters access</h1>
        <p>Use the admin password from your <code>.env</code> file.</p>
    </aside>
    <div class="glass-card auth-card reveal" style="--d: 80ms">
        <h2>Admin login</h2>
        {% if error %}
        <div class="banner banner-error">{{ error }}</div>
        {% endif %}
        <form action="/admin/login" method="post" class="stack-form">
            <label>
                <span>Admin password</span>
                <input type="password" name="password" id="password" autocomplete="current-password" required>
            </label>
            <button type="submit" class="btn btn-primary btn-block">Enter dashboard</button>
        </form>
    </div>
</div>
{% endblock %}
