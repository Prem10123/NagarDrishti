{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Admin login</h4>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                <p class="text-muted small">Use the <code>ADMIN_PASSWORD</code> from your <code>.env</code> file.</p>
                <form action="/admin/login" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="password">Admin password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Enter dashboard</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
