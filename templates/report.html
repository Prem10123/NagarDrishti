{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Report an urban issue</h4>
            </div>
            <div class="card-body">
                <form action="/report" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Photo evidence</label>
                        <input type="file" name="file" id="imageUpload" class="form-control" accept="image/*" capture="environment" required>
                        <small id="aiStatus" class="form-text text-muted">Upload a photo to auto-detect the category.</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold" for="categoryId">Category</label>
                        <select name="category_id" id="categoryId" class="form-select" required>
                            <option value="" disabled selected>Select category...</option>
                            {% for cid, cname in categories.items() %}
                            <option value="{{ cid }}">{{ cid }}. {{ cname }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div id="forceOption" class="mb-3 p-3 border border-warning bg-warning-subtle rounded d-none">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="force_submit" value="true" id="forceCheck">
                            <label class="form-check-label fw-bold" for="forceCheck">
                                AI disagrees. I confirm my category is correct.
                            </label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Location</label>
                        <div class="input-group">
                            <button type="button" class="btn btn-outline-primary" id="gpsBtn">Use GPS</button>
                            <input type="text" name="address" id="address" class="form-control" placeholder="Address" required>
                        </div>
                        <small id="geo-status" class="form-text"></small>
                        <input type="hidden" name="latitude" id="latitude" value="0.0">
                        <input type="hidden" name="longitude" id="longitude" value="0.0">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Description</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="Describe the issue..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-danger w-100 py-2">Submit report</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
